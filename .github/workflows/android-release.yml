name: Android Release APK

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional GitHub Release tag to publish, for example 1.0.24'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build lightweight release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      NODE_ENV: production
      EXPO_UNSTABLE_CORE_AUTOLINKING: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle wrapper distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: gradle-wrapper-${{ hashFiles('android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-wrapper-

      - name: Cache Gradle caches
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches
          key: gradle-caches-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: gradle-caches-

      - name: Install dependencies
        run: npm ci

      - name: Verify release version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(node -p "require('./app.json').expo.version")
          PKG_VERSION=$(node -p "require('./package.json').version")
          GRADLE_NAME=$(grep -oE 'versionName\s+"[^"]+"' android/app/build.gradle | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          GRADLE_CODE=$(grep -oE 'versionCode\s+[0-9]+' android/app/build.gradle | head -1 | grep -oE '[0-9]+$')
          APP_CODE=$(node -p "require('./app.json').expo.android.versionCode")

          echo "tag version:     $TAG"
          echo "app.json:        $APP_VERSION (code $APP_CODE)"
          echo "package.json:    $PKG_VERSION"
          echo "build.gradle:    $GRADLE_NAME (code $GRADLE_CODE)"

          FAIL=0
          if [[ "$APP_VERSION" != "$TAG" ]]; then
            echo "::error::app.json version ($APP_VERSION) does not match tag ($TAG). Run: npm run release -- $TAG"
            FAIL=1
          fi
          if [[ "$PKG_VERSION" != "$TAG" ]]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG)."
            FAIL=1
          fi
          if [[ "$GRADLE_NAME" != "$TAG" ]]; then
            echo "::error::android versionName ($GRADLE_NAME) does not match tag ($TAG)."
            FAIL=1
          fi
          if [[ "$GRADLE_CODE" != "$APP_CODE" ]]; then
            echo "::error::android versionCode ($GRADLE_CODE) does not match app.json ($APP_CODE)."
            FAIL=1
          fi
          exit $FAIL

      - name: Build lightweight APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          SUCCESS=0
          for attempt in 1 2 3; do
            if ./gradlew clean assembleRelease \
              -PreactNativeArchitectures=arm64-v8a \
              -Pexpo.useLegacyPackaging=true \
              --no-daemon; then
              SUCCESS=1
              break
            fi
            echo "Attempt $attempt failed, retrying in 15s..."
            sleep 15
          done
          if [ $SUCCESS -ne 1 ]; then
            echo "All Gradle build attempts failed."
            exit 1
          fi

      - name: Resolve release name
        id: release
        run: |
          MANUAL_TAG="${{ inputs.release_tag }}"
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            RELEASE_TAG="${GITHUB_REF_NAME}"
          elif [[ -n "$MANUAL_TAG" ]]; then
            RELEASE_TAG="$MANUAL_TAG"
          else
            RELEASE_TAG="manual-${GITHUB_RUN_NUMBER}"
          fi

          echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "apk_name=thunder-wallet-${RELEASE_TAG}.apk" >> "$GITHUB_OUTPUT"

      - name: Prepare APK asset
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/${{ steps.release.outputs.apk_name }}"
          ls -lh release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: thunder-wallet-release-apk
          path: release/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.release.outputs.tag }}"
          APK_PATH="release/${{ steps.release.outputs.apk_name }}"

          if ! git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG_NAME" "$GITHUB_SHA"
            git push origin "$TAG_NAME"
          fi

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" \
              --target "$GITHUB_SHA" \
              --title "Thunder Wallet ${TAG_NAME}" \
              --notes "Lightweight Android release APK built automatically from ${GITHUB_SHA}."
          fi
